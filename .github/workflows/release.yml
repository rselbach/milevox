name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    container: ubuntu@sha256:2edbbc5dc405e9612ba3584ce95480277e3eb374407b5505fe26f17df77c7dbc
    steps:
      - name: Install container prerequisites
        run: |
          apt-get update
          apt-get install --yes binutils build-essential ca-certificates cmake curl git \
            libasound2-dev libpipewire-0.3-dev libssl-dev ninja-build pkg-config python3 python3-pip
          python3 -m pip install cmake==3.31.6
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The pinned action installs the version declared by rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Verify tag and metadata
        run: |
          source scripts/lib-release.sh
          version="$(project_version "${PWD}")"
          validate_version "${GITHUB_REF_NAME#v}"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Build ONNX Runtime on the baseline ABI
        run: |
          ./scripts/build-onnxruntime.sh "${RUNNER_TEMP}/onnxruntime"
          echo "ORT_LIB_PATH=${RUNNER_TEMP}/onnxruntime/build/Release" >> "${GITHUB_ENV}"
      - name: Build and verify release archive
        run: |
          ./scripts/package-release.sh
          cd dist
          sha256sum --check ./*.sha256
          archive="milevox-linux-${{ matrix.arch }}.tar.gz"
          binary="${RUNNER_TEMP}/milevox"
          tar --extract --gzip --to-stdout --file "${archive}" \
            "milevox-linux-${{ matrix.arch }}/bin/milevox" >"${binary}"
          chmod +x "${binary}"
          source ../scripts/lib-release.sh
          ../scripts/check-abi.sh "${binary}" "$(project_version ..)"
      - name: Build Omarchy archive
        if: matrix.arch == 'x86_64'
        run: ./scripts/package-omarchy-release.sh
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: raw-release-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: raw-release-*
          path: dist
          merge-multiple: true
      - name: Build pacman packages
        run: |
          docker run --rm --volume "${PWD}:/workspace" --workdir /workspace \
            archlinux@sha256:714acd1eef9ae997d95691b1c5220ada0076185b77857c1813f02de0fa83cf7b \
            bash -lc '
              set -euo pipefail
              useradd --create-home builder
              chown -R builder:builder /workspace/dist
              for arch in x86_64 aarch64; do
                runuser -u builder -- ./scripts/package-arch-release.sh milevox \
                  "dist/milevox-linux-${arch}.tar.gz"
              done
              archive="$(find dist -name "milevox-omarchy-*.tar.gz" -print -quit)"
              runuser -u builder -- ./scripts/package-arch-release.sh \
                milevox-omarchy "${archive}"
            '
      - name: Checksum packages
        run: |
          for package in dist/*.pkg.tar.zst; do
            name="$(basename -- "${package}")"
            (cd dist && sha256sum -- "${name}" >"${name}.sha256")
          done
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: pacman-packages
          path: dist/*.pkg.tar.zst*
          if-no-files-found: error

  attest:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "*release-*"
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pacman-packages
          path: release-assets
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

  verify:
    needs: attest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "*release-*"
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pacman-packages
          path: release-assets
      - name: Verify checksums and attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd release-assets && sha256sum --check ./*.sha256)
          for asset in release-assets/*; do
            gh attestation verify "${asset}" --repo "${GITHUB_REPOSITORY}"
          done

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "*release-*"
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pacman-packages
          path: release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --generate-notes --verify-tag --repo "${GITHUB_REPOSITORY}"
