name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libpipewire-0.3-dev \
            pkg-config
      - name: Install Rust 1.98
        run: |
          rustup toolchain install 1.98.0 --profile minimal \
            --component clippy,rustfmt
          rustup default 1.98.0
      - name: Check shell scripts
        run: |
          bash -n install.sh uninstall.sh scripts/*.sh \
            guis/omarchy/install.sh guis/omarchy/uninstall.sh
      - name: Validate Omarchy GUI metadata
        run: |
          test "$(jq -r .schemaVersion guis/omarchy/manifest.json)" = "1"
          test -f guis/omarchy/Panel.qml
          test -f guis/omarchy/MilevoxOverlay.qml
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked --all-targets
