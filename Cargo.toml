[package]
name = "milevox"
version = "0.1.3"
edition = "2024"
rust-version = "1.98"
description = "Local speech-to-text with guarded transcript refinement"
license = "MIT"
repository = "https://github.com/rselbach/milevox"
homepage = "https://github.com/rselbach/milevox"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
cpal = { version = "0.18.2", features = ["pipewire"] }
parakeet-rs = "0.3.7"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.4"
